services:
  jxc:
    build: .
    container_name: jxc
    restart: unless-stopped
    ports:
      - "${PORT:-3081}:3001"
    environment:
      PORT: 3001
      DATA_DIR: /app/data
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_SECRET: ${APP_SECRET:?请在 .env 中设置至少 32 位随机密钥}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - jxc-data:/app/data

volumes:
  jxc-data:
